  initial_value: 'false'

# History charts: Temperature (left), Humidity (middle), CO2 + VOC (right).
# Each sensor keeps its own 24-point rolling trace; the selected time range controls the time span represented.
- id: hist_temp_samples
  type: std::vector<float>
  restore_value: no
  initial_value: 'std::vector<float>()'
- id: hist_humidity_samples
  type: std::vector<float>
  restore_value: no
  initial_value: 'std::vector<float>()'
- id: hist_co2_samples
  type: std::vector<float>
  restore_value: no
  initial_value: 'std::vector<float>()'
- id: hist_voc_samples
  type: std::vector<float>
  restore_value: no
  initial_value: 'std::vector<float>()'

