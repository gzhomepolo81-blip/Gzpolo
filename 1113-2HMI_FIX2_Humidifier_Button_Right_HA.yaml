esphome:
  name: hmi-system
  friendly_name: HMI System

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

json:

logger:
  level: WARN
  logs:
    homeassistant.sensor: WARN

api:
  encryption:
    key: "6pQqTj/pSjZ3zeMJyI3i2KB9uczRNSiKdeHV2RFWoUw="

ota:
- platform: esphome

wifi:
  ssid: RRC Home Assistant
  password: password

  ap:
    ssid: "Smart-HMI-Fallback"
    password: "HmiFallback72"

captive_portal:

