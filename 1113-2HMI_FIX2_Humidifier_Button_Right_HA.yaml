# ==========================================
# LVGL - FIVE HMI PAGES
# This is a visual/control-interface foundation. Sensor and actuator
# actions are placeholders until Home Assistant entities are connected.
# ==========================================
lvgl:
  displays:
  - my_display
  touchscreens:
  - my_touchscreen
  color_depth: 16
  bg_color: 0xF5FCFC
  text_color: 0x111111
