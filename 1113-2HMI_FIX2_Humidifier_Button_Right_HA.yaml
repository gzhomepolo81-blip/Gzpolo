    then:
    - lvgl.widget.update:
        id: led_temperature_1
        bg_color: !lambda |-
          return id(hmi_emergency_mode) ? (id(hmi_emergency_flash) ? lv_color_hex(0xFF0000) : lv_color_hex(0x808080)) : (id(hmi_indicator_enabled) && !id(hmi_night_mode) && id(hmi_temp_ready) && (int) roundf(fmaxf(0.0f, fminf(1.0f, (id(hmi_temp) - 15.0f) / 15.0f)) * 6.0f) >= 1 ? lv_color_hex(0xFF0000) : lv_color_hex(0x808080));
