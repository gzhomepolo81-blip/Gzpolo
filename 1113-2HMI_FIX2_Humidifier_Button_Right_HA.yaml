number:
- platform: template
  id: minimum_temperature
  name: "HMI Minimum Temperature"
  min_value: 10
  max_value: 30
  step: 0.5
  initial_value: 18
  optimistic: true
  restore_value: true
  unit_of_measurement: "°C"
  on_value:
    then:
    - lvgl.label.update:
        id: min_temperature_value
        text: !lambda |-
          return str_sprintf("%.1f°", x);

- platform: template
  id: target_temperature
  name: "HMI Target Temperature"
  min_value: 10
  max_value: 30
  step: 0.5
  initial_value: 22
  optimistic: true
  restore_value: true
  unit_of_measurement: "°C"
  on_value:
    then:
    - lvgl.label.update:
        id: target_temperature_value
        text: !lambda |-
          return str_sprintf("%.1f°", x);

- platform: template
  id: maximum_temperature
  name: "HMI Maximum Temperature"
  min_value: 15
  max_value: 40
  step: 0.5
  initial_value: 26
  optimistic: true
  restore_value: true
  unit_of_measurement: "°C"
  on_value:
    then:
    - lvgl.label.update:
        id: max_temperature_value
        text: !lambda |-
          return str_sprintf("%.1f°", x);

# HOME ASSISTANT SENSOR DATA
time:
- platform: sntp
  id: hmi_clock
  timezone: America/Winnipeg
  on_time:
    - seconds: /1
      then:
        - lvgl.label.update:
            id: date_value
            text: !lambda |-
              auto now = id(hmi_clock).now();
              if (!now.is_valid()) return "Syncing date...";
              return now.strftime("%a, %b %d, %Y");
        - lvgl.label.update:
            id: time_value
            text: !lambda |-
              auto now = id(hmi_clock).now();
              if (!now.is_valid()) return "Syncing...";
              return now.strftime("%I:%M %p");
        - lvgl.label.update:
            id: weather_header_date
            text: !lambda |-
              auto now = id(hmi_clock).now();
              if (!now.is_valid()) return "Syncing date...";
              return now.strftime("%a, %b %d, %Y");
        - lvgl.label.update:
            id: weather_header_time
            text: !lambda |-
              auto now = id(hmi_clock).now();
              if (!now.is_valid()) return "Syncing...";
              return now.strftime("%I:%M %p");

sensor:
- platform: homeassistant
  id: ha_temperature
  entity_id: sensor.ke_ting_senser_temperature
  internal: true
  on_value:
    then:
    - lambda: |-
        if (isnan(x)) return;
        id(hmi_temp) = x;
        id(hmi_temp_ready) = true;
        auto &samples = id(hist_temp_samples);
        samples.push_back(x);
        if (samples.size() > 24) samples.erase(samples.begin());
    - lvgl.line.update:
        id: history_temp_curve
        points:
          - x: 0
            y: !lambda |-
              auto &v = id(hist_temp_samples); if (v.empty() || 0 < (24 - (int)v.size())) return 220; int k = 0 - (24 - (int)v.size()); float a = v[k]; if (a < 10.0f) a = 10.0f; if (a > 40.0f) a = 40.0f; return (int)(210.0f - ((a - 10.0f) / (30.0f)) * 195.0f);
