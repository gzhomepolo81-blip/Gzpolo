script:
  - id: hmi_check_emergency
    mode: restart
    then:
      - lambda: |-
          if (!id(hmi_co2_ready) || !id(hmi_voc_ready) || !id(hmi_nox_ready)) {
            id(hmi_recovery_start_ms) = 0;
            return;
          }

          if (id(hmi_co2) >= 1500.0f) id(hmi_co2_emergency) = true;
          if (id(hmi_voc) >= 300.0f) id(hmi_voc_emergency) = true;
          if (id(hmi_nox) >= 100.0f) id(hmi_nox_emergency) = true;

          bool any_latched = id(hmi_co2_emergency) ||
                             id(hmi_voc_emergency) ||
                             id(hmi_nox_emergency);

          if (!any_latched) {
            id(hmi_emergency_mode) = false;
            id(hmi_recovery_start_ms) = 0;
          } else {
            bool all_safe = id(hmi_co2) <= 1400.0f &&
                            id(hmi_voc) <= 280.0f &&
                            id(hmi_nox) <= 90.0f;
            if (all_safe) {
              if (id(hmi_recovery_start_ms) == 0)
                id(hmi_recovery_start_ms) = millis();

              if ((uint32_t)(millis() - id(hmi_recovery_start_ms)) >= 30000UL) {
                id(hmi_co2_emergency) = false;
                id(hmi_voc_emergency) = false;
                id(hmi_nox_emergency) = false;
                id(hmi_emergency_mode) = false;
                id(hmi_recovery_start_ms) = 0;
              } else {
                id(hmi_emergency_mode) = true;
              }
            } else {
              id(hmi_recovery_start_ms) = 0;
              id(hmi_emergency_mode) = true;
            }
          }

  - id: hmi_toggle_night_mode
    mode: restart
    then:
      - lambda: |-
          id(hmi_night_mode) = !id(hmi_night_mode);
      - if:
          condition:
            lambda: 'return id(hmi_night_mode);'
          then:
            - lvgl.image.update: {id: dashboard_night_button, src: btn_night_on}
            - lvgl.image.update: {id: control_night_button, src: btn_night_on}
          else:
            - lvgl.image.update: {id: dashboard_night_button, src: btn_night_off}
            - lvgl.image.update: {id: control_night_button, src: btn_night_off}
      - script.execute: hmi_update_led_ring

  - id: hmi_set_hvac_auto
    mode: restart
    then:
      - homeassistant.service:
          service: switch.turn_on
          data:
            entity_id: switch.esp32_c6_hvac_controller_hvac_auto_mode

  - id: hmi_set_hvac_manual
    mode: restart
    then:
      - homeassistant.service:
          service: switch.turn_off
          data:
            entity_id: switch.esp32_c6_hvac_controller_hvac_auto_mode

  - id: hmi_set_fan_low
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_manual_fan_speed).state == "LOW";'
          then:
            - homeassistant.service:
                service: select.select_option
                data:
                  entity_id: select.esp32_c6_hvac_controller_hvac_manual_fan_speed
                  option: CLOSE
          else:
            - homeassistant.service:
                service: select.select_option
                data:
                  entity_id: select.esp32_c6_hvac_controller_hvac_manual_fan_speed
                  option: LOW

  - id: hmi_set_fan_mid
    mode: restart
    then:
      - homeassistant.service:
          service: select.select_option
          data:
            entity_id: select.esp32_c6_hvac_controller_hvac_manual_fan_speed
            option: MID

  - id: hmi_set_fan_high
    mode: restart
    then:
      - homeassistant.service:
          service: select.select_option
          data:
            entity_id: select.esp32_c6_hvac_controller_hvac_manual_fan_speed
            option: HIGH

  - id: hmi_toggle_humidifier
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_humidifier_state).state;'
          then:
            - homeassistant.service:
                service: switch.turn_off
                data:
                  entity_id: switch.esp32_c6_hvac_controller_hvac_mist_maker
          else:
            - homeassistant.service:
                service: switch.turn_on
                data:
                  entity_id: switch.esp32_c6_hvac_controller_hvac_mist_maker

  - id: hmi_update_led_ring
