  - interval: 500ms
    then:
      - script.execute: hmi_check_emergency
      - lambda: |-
          if (id(hmi_emergency_mode))
            id(hmi_emergency_flash) = !id(hmi_emergency_flash);
          else
            id(hmi_emergency_flash) = false;
      - script.execute: hmi_update_led_ring

# ==========================================
# I2C BUS
# CH32V003 I/O expander and GT911
# ==========================================

i2c:
  id: bus_a
  sda: GPIO8
  scl: GPIO9
  frequency: 400kHz
  scan: true


# ==========================================
# Waveshare CH32V003 IO EXPANDER
# ==========================================

waveshare_io_ch32v003:
- id: wave_hub
  address: 0x24
  i2c_id: bus_a


# ==========================================
# SCREEN BACKLIGHT
# CH422G EXIO2
# ==========================================

# ==========================================
# SCREEN BACKLIGHT CONTROL
# Waveshare ESP32-S3-Touch-LCD-7B
# ==========================================

power_supply:
- id: wave_hub_backlight_enable
  pin:
    waveshare_io_ch32v003: wave_hub
    number: 2
    mode:
      output: true
  enable_time: 0ms
  keep_on_time: 0ms
  enable_on_boot: true

output:
- platform: waveshare_io_ch32v003
  id: wave_pwm_out
  waveshare_io_ch32v003_id: wave_hub
  power_supply: wave_hub_backlight_enable
  inverted: true
  zero_means_zero: true
  safe_pwm_levels:
    min_value: 1
    max_value: 247

light:
- platform: monochromatic
  id: lcd_backlight
  name: "HMI Screen Backlight"
  output: wave_pwm_out
  restore_mode: ALWAYS_ON
  default_transition_length: 0.5s


# ==========================================
# DISPLAY
# 1024 x 600 LANDSCAPE
# ==========================================

# Waveshare ESP32-S3-Touch-LCD-7B RGB panel configuration.
# Uses the CH32V003 I/O expander for LCD enable, reset and backlight.
display:
- platform: mipi_rgb
  id: my_display
  model: RPI
  dimensions:
    width: 1024
    height: 600
  update_interval: never
  auto_clear_enabled: false
  color_order: RGB
  pclk_frequency: 30MHz
  pclk_inverted: true

    # LCD power enable: CH32V003 output 6
  enable_pin:
  - waveshare_io_ch32v003: wave_hub
    number: 6
    mode: OUTPUT

    # LCD reset: CH32V003 output 3
  reset_pin:
    waveshare_io_ch32v003: wave_hub
    number: 3
    mode: OUTPUT

  de_pin: 5
  hsync_pin:
    number: 46
    ignore_strapping_warning: true
  vsync_pin:
    number: 3
  pclk_pin: 7

  hsync_pulse_width: 162
  hsync_back_porch: 152
  hsync_front_porch: 48
  vsync_pulse_width: 45
  vsync_back_porch: 13
  vsync_front_porch: 3

    # RGB565 data pins, from Waveshare's 7B RGB LCD example.
  data_pins:
    red: [1, 2, 42, 41, 40]
    green: [39, 0, 45, 48, 47, 21]
    blue: [14, 38, 18, 17, 10]


# ==========================================
# TOUCHSCREEN
# GT911
# ==========================================

touchscreen:
- platform: gt911
  id: my_touchscreen
  display: my_display
  interrupt_pin: GPIO4

  reset_pin:
    waveshare_io_ch32v003: wave_hub
    number: 1
    mode: OUTPUT

  on_touch:
  - logger.log:
      format: "Touch: X=%d, Y=%d"
      args: [touch.x, touch.y]
  - lambda: |-
      ESP_LOGI("TOUCH", "X=%d, Y=%d, RawX=%d, RawY=%d",
               touch.x, touch.y, touch.x_raw, touch.y_raw);

