binary_sensor:
  - platform: homeassistant
    id: ha_auto_mode_state
    entity_id: switch.esp32_c6_hvac_controller_hvac_auto_mode
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.image.update: {id: dashboard_auto_button, src: btn_auto_on}
              - lvgl.image.update: {id: dashboard_manual_button, src: btn_manual_off}
              - lvgl.image.update: {id: control_auto_button, src: btn_auto_on}
              - lvgl.image.update: {id: control_manual_button, src: btn_manual_off}
            else:
              - lvgl.image.update: {id: dashboard_auto_button, src: btn_auto_off}
              - lvgl.image.update: {id: dashboard_manual_button, src: btn_manual_on}
              - lvgl.image.update: {id: control_auto_button, src: btn_auto_off}
              - lvgl.image.update: {id: control_manual_button, src: btn_manual_on}
  - platform: homeassistant
    id: ha_humidifier_state
    entity_id: switch.esp32_c6_hvac_controller_hvac_mist_maker
    internal: true
    on_state:
      then:
        - if:
            condition:
              lambda: 'return x;'
            then:
              - lvgl.image.update: {id: humidifier_button, src: humidifier_on}
              - lvgl.label.update:
                  id: humidifier_state_label
                  text: "ON"
                  text_color: 0x168A45
              - lvgl.label.update:
                  id: control_humidifier_output_label
                  text: "ON"
                  text_color: 0x168A45
            else:
              - lvgl.image.update: {id: humidifier_button, src: humidifier_off}
              - lvgl.label.update:
                  id: humidifier_state_label
                  text: "OFF"
                  text_color: 0x64748B
              - lvgl.label.update:
                  id: control_humidifier_output_label
                  text: "OFF"
                  text_color: 0x64748B
  - platform: homeassistant
    id: ha_indicator_light_state
    entity_id: switch.indicator_light_indicator
    internal: true
    on_state:
      then:
        - lambda: 'id(hmi_indicator_enabled) = x;'
        - script.execute: hmi_update_led_ring

text_sensor:
  - platform: homeassistant
    id: ha_daily_forecast_json
    entity_id: sensor.weather_forecast_daily
    attribute: forecast
    internal: true
    on_value:
      then:
        - lambda: |-
            auto doc = json::parse_json(x);
            if (!doc.is<JsonArray>()) {
              ESP_LOGW("weather", "Forecast JSON is not an array");
              return;
            }
            JsonArray forecast = doc.as<JsonArray>();
            int i = 0;
            for (JsonObject item : forecast) {
                if (i >= 7) break;
                std::string dt = item["datetime"] | "";
                std::string day = dt.size() >= 10 ? dt.substr(5, 5) : "Day";
                std::string cond = item["condition"] | "";
                std::string icon = "CLD";
                if (cond.find("sunny") != std::string::npos || cond.find("clear") != std::string::npos) icon = "SUN";
                else if (cond.find("rain") != std::string::npos || cond.find("pour") != std::string::npos || cond.find("lightning") != std::string::npos) icon = "RAIN";
                else if (cond.find("snow") != std::string::npos || cond.find("hail") != std::string::npos) icon = "SNOW";
                else if (cond.find("fog") != std::string::npos || cond.find("mist") != std::string::npos) icon = "FOG";
                char high[20], low[20];
                snprintf(high, sizeof(high), "H %.0f°", (double)(item["temperature"] | NAN));
                snprintf(low, sizeof(low), "L %.0f°", (double)(item["templow"] | NAN));
                switch (i) {
                  case 0: lv_label_set_text(id(weather_day_0_name), day.c_str()); lv_label_set_text(id(weather_day_0_icon), icon.c_str()); lv_label_set_text(id(weather_day_0_high), high); lv_label_set_text(id(weather_day_0_low), low); break;
                  case 1: lv_label_set_text(id(weather_day_1_name), day.c_str()); lv_label_set_text(id(weather_day_1_icon), icon.c_str()); lv_label_set_text(id(weather_day_1_high), high); lv_label_set_text(id(weather_day_1_low), low); break;
